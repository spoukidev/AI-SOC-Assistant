services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-soc_xai}
      POSTGRES_USER: ${POSTGRES_USER:-soc_xai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-non-local-use}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soc_xai} -d ${POSTGRES_DB:-soc_xai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://soc_xai:change-me-for-non-local-use@postgres:5432/soc_xai}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-60}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      RULE_ENGINE_ENABLED: ${RULE_ENGINE_ENABLED:-true}
      AUTO_CORRELATION_ENABLED: ${AUTO_CORRELATION_ENABLED:-true}
      CORRELATION_WINDOW_MINUTES: ${CORRELATION_WINDOW_MINUTES:-60}
      CORRELATION_MIN_ALERTS: ${CORRELATION_MIN_ALERTS:-2}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
